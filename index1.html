      <div><b class="tnum">${Q.length}</b><span>questions in the bank</span></div>
      <div><b class="tnum">${skillsOf('rw').length + skillsOf('math').length}</b><span>skills, the College Board's own list</span></div>
      <div><b class="tnum">${grids}</b><span>grid-in, no answer choices</span></div>
      <div><b class="tnum">${answered ? pct(right, answered) + '%' : '—'}</b><span>your accuracy so far</span></div>
    </div>

    <div class="rule"><span class="eyebrow">Start</span></div>
    <div class="modes">
      <button class="mode" onclick="goDrill()">
        <span class="kicker">Drill</span>
        <h3>Practice by skill</h3>
        <p>Choose any of the 29 reported skills. Feedback and a worked explanation land the moment you answer.</p>
        <span class="meta">untimed · 5–25 questions</span>
      </button>
      <button class="mode" onclick="goSection()">
        <span class="kicker">Section</span>
        <h3>Full timed section</h3>
        <p>54 questions in 64 minutes, or 44 in 70. Sampled to the real domain weights, with the on-screen tools from test day.</p>
        <span class="meta">timed · submit to see answers</span>
      </button>
      <button class="mode" onclick="startMissed()" ${store.missed.length ? '' : 'disabled'}>
        <span class="kicker">Rematch</span>
        <h3>Questions you missed</h3>
        <p>${store.missed.length
            ? 'Every question you have gotten wrong, held here until you get it right.'
            : 'Miss something and it lands here automatically, then leaves when you get it right.'}</p>
        <span class="meta">${store.missed.length ? store.missed.length + ' waiting' : 'empty'}</span>
      </button>
    </div>

    <div class="rule"><span class="eyebrow">What a section is made of</span></div>
    <div class="bp">
      ${bpRow('rw')}
      ${bpRow('math')}
    </div>
    <p class="sub" style="font-size:13px;margin-top:12px">
      Left to right: ${DOMAINS.rw.map(d => d.name).join(' · ')} — and for math,
      ${DOMAINS.math.map(d => d.name).join(' · ')}. A generated section samples the bank to hit these counts.
    </p>

    <div class="rule"><span class="eyebrow">On-screen tools</span></div>
    <div class="callout">
      <b>Cross-out</b> strikes through choices you have ruled out — the single highest-value habit on
      the real test. <b>Mark for review</b> flags a question and the navigator shows which ones are still
      open. Math gets the <b>reference sheet</b>. The timer can be hidden if watching it makes things worse.
    </div>
  </div>`;
  markNav('home'); show('home');
}

/* ── drill picker ───────────────────────────────────────────────────────── */
function goDrill(){
  const sec = S.pick.sec;
  const doms = DOMAINS[sec].map(d => {
    const cells = d.skills.map(sk => {
      const n = inSkill(sk).length;
      const p = skillPct(sk);
      const on = S.pick.skills.has(sk);
      const acc = p === null ? '' :
        `<span class="acc ${barBand(p)}"><i style="width:${p}%"></i></span>`;
      return `<button class="skill ${on ? 'on' : ''}" onclick="toggleSkill('${esc(sk).replace(/'/g,"\\'")}')" ${n ? '' : 'disabled'}>
        <span class="nm">${esc(sk)}</span>
        <span class="ct">${p === null ? n : p + '% · ' + n}</span>
        ${acc}
      </button>`;
    }).join('');
    return `<div class="domain">
      <div class="domainhd"><h3>${esc(d.name)}</h3><span class="pctag">${d.share} of the section</span></div>
      <div class="skills">${cells}</div>
    </div>`;
  }).join('');

  const nSel = S.pick.skills.size;
  const pool = nSel ? Q.filter(q => S.pick.skills.has(q.skill)).length : 0;

  document.getElementById('s-pick').innerHTML = `
  <div class="wrap wrap-wide">
    <div class="eyebrow">Drill</div>
    <h1 class="h1" style="margin:6px 0 8px">Practice by skill</h1>
    <p class="sub" style="max-width:62ch">Pick one skill to grind it, or several to mix. The bar under each
    skill is your accuracy on it so far, so the weak ones are visible before you choose.</p>

    <div style="display:flex;gap:12px;align-items:center;margin:22px 0 20px;flex-wrap:wrap">
      <div class="seg">
        <button class="${sec==='rw'?'on':''}" onclick="pickSec('rw')">Reading and Writing</button>
        <button class="${sec==='math'?'on':''}" onclick="pickSec('math')">Math</button>
      </div>
      <button class="btn btn-quiet" onclick="selectDomainAll()">Select all in section</button>
      ${nSel ? `<button class="btn btn-quiet" onclick="clearSkills()">Clear (${nSel})</button>` : ''}
    </div>

    ${doms}

    <div class="pickbar">
      <div class="seg">
        ${[5,10,15,25].map(n => `<button class="${S.pick.len===n?'on':''}" onclick="pickLen(${n})">${n}</button>`).join('')}
      </div>
      <span class="sub" style="font-size:13px">questions${nSel ? ` · ${pool} in pool` : ''}</span>
      <button class="btn btn-primary btn-lg" style="margin-left:auto" ${nSel ? '' : 'disabled'} onclick="startDrill()">
        ${nSel ? 'Start drill' : 'Pick a skill'}
      </button>
    </div>
  </div>`;
  markNav('drill'); show('pick');
}
function pickSec(s){ S.pick.sec = s; goDrill(); }
function pickLen(n){ S.pick.len = n; goDrill(); }
function toggleSkill(sk){
  S.pick.skills.has(sk) ? S.pick.skills.delete(sk) : S.pick.skills.add(sk);
  goDrill();
}
function clearSkills(){ S.pick.skills.clear(); goDrill(); }
function selectDomainAll(){
  skillsOf(S.pick.sec).forEach(s => { if(inSkill(s).length) S.pick.skills.add(s); });
  goDrill();
}

function startDrill(){
  const pool = Q.filter(q => S.pick.skills.has(q.skill));
  if(!pool.length) return;
  const label = S.pick.skills.size === 1
    ? [...S.pick.skills][0]
    : `${S.pick.skills.size} skills`;
  begin({
    mode:'drill', sec:S.pick.sec, label,
    list:take(pool, Math.min(S.pick.len, pool.length)),
    timed:false
  });
}

function startMissed(){
  const pool = store.missed.map(byId).filter(Boolean);
  if(!pool.length) return;
  begin({
    mode:'missed', sec:'mix', label:'Rematch',
    list:shuffle(pool).slice(0, 25), timed:false
  });
}

/* ── section picker ─────────────────────────────────────────────────────── */
function goSection(){
  const card = (sec) => {
    const b = BLUEPRINT[sec];
    const have = Q.filter(q => q.sec === sec).length;
    const rows = DOMAINS[sec].map(d =>
      `<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);padding:3px 0">
        <span>${esc(d.name)}</span><span class="tnum" style="font-family:var(--mono)">${b.counts[d.name]}</span>
      </div>`).join('');
    return `<button class="mode" onclick="startSection('${sec}')" style="gap:10px">
      <span class="kicker">${sec === 'rw' ? 'Module of 54' : 'Module of 44'}</span>
      <h3>${b.label}</h3>
      <p>${sec === 'rw'
        ? 'Short standalone passages, one question each, in the order the real section runs them.'
        : 'Multiple choice and student-produced response, calculator allowed throughout.'}</p>
      <div style="width:100%;border-top:1px solid var(--line);margin-top:6px;padding-top:8px">${rows}</div>
      <span class="meta">${b.minutes} minutes · ${have} in bank</span>
    </button>`;
  };

  document.getElementById('s-pick').innerHTML = `
  <div class="wrap">
    <div class="eyebrow">Section</div>
    <h1 class="h1" style="margin:6px 0 8px">Full timed section</h1>
    <p class="sub" style="max-width:62ch">Answers stay hidden until you submit. You can skip, come back,
    mark questions for review, and cross out choices — same as test day.</p>
    <div class="modes" style="margin-top:24px">${card('rw')}${card('math')}</div>
    <div class="callout" style="margin-top:20px">
      <b>One honest difference:</b> the real test is adaptive — how you do on the first module decides
      whether the second is the hard one. This is a single fixed module, so treat the score estimate at
      the end as a ballpark, not a prediction.
    </div>
  </div>`;
  markNav('section'); show('pick');
}

function startSection(sec){
  const b = BLUEPRINT[sec];
  let list = [];
  DOMAINS[sec].forEach(d => {
    const pool = inDomain(d.name);
    const want = b.counts[d.name];
    // If the bank is short on a domain, top up by reusing shuffled questions.
    let picked = take(pool, Math.min(want, pool.length));
    while(picked.length < want && pool.length) picked = picked.concat(take(pool, Math.min(want - picked.length, pool.length)));
    list = list.concat(picked);
  });
  // The real section runs its domains in a fixed order; keep that, shuffle within.
  const order = DOMAINS[sec].map(d => d.name);
  list.sort((a,z) => order.indexOf(a.dom) - order.indexOf(z.dom));
  begin({ mode:'section', sec, label:b.label, list, timed:true, minutes:b.minutes });
}

/* ── quiz ───────────────────────────────────────────────────────────────── */
function begin(cfg){
  Object.assign(S, cfg);
  S.i = 0;
  S.ans     = new Array(S.list.length).fill(null);
  S.struck  = S.list.map(() => []);
  S.flagged = new Array(S.list.length).fill(false);
  S.checked = new Array(S.list.length).fill(false);
  S.abc = false;
  S.hideTimer = false;
  stopClock();
  if(cfg.timed){ S.left = cfg.minutes * 60; startClock(); }
  renderQuiz();
  show('quiz');
}

const instant = () => S.mode !== 'section';

function renderQuiz(){
  const q = S.list[S.i], n = S.list.length;
  const done = S.checked[S.i];
  const split = q.sec === 'rw' && q.stim;

  /* ── top bar ── */
  const timer = S.timed ? `
    <div class="clock">
      <span class="t ${S.hideTimer ? 'hidden-t' : ''} ${S.left <= 300 ? 'warn' : ''}" id="tdisp">${S.hideTimer ? '• • • • •' : clock(S.left)}</span>
      <button onclick="toggleTimer()">${S.hideTimer ? 'Show' : 'Hide'}</button>
    </div>` : `<div class="clock"><span class="t" style="font-size:14px;color:var(--ink-3)">Untimed</span></div>`;

  const tools = `
    <div class="tools">
      ${q.sec === 'math' ? '<button class="tool" onclick="openReference()">◳ <span>Reference</span></button>' : ''}
      <button class="tool" onclick="openDirections()">? <span>Directions</span></button>
      <button class="tool" onclick="quitQuiz()">✕ <span>Exit</span></button>
    </div>`;

  /* ── question body ── */
  const head = `
    <div class="qhead">
      <span class="qnum">${S.i + 1}</span>
      <button class="markbtn ${S.flagged[S.i] ? 'on' : ''}" onclick="toggleFlag()">
        <span class="fl">${S.flagged[S.i] ? '⚑' : '⚐'}</span> Mark for Review
      </button>
      ${q.type === 'grid' ? '' :
        `<button class="abcbtn ${S.abc ? 'on' : ''}" onclick="toggleAbc()" title="Cross out answer choices">ABC</button>`}
    </div>`;

  const body = q.type === 'grid' ? gridHTML(q) : choicesHTML(q);
  const expl = (instant() && done) ? explHTML(q) : '';
  const stem = `<div class="qstem">${mx(q.q)}</div>`;

  const left = renderStim(q.stim);

  // Split view puts the stimulus in its own pane. Single-column keeps the
  // question number and Mark for Review at the top, the way the real app does,
  // with any figure or table sitting between that row and the stem.
  const stage = split
    ? `<div class="stage is-split" id="stage"><div class="split">
         <div class="pane pane-l"><div class="pane-inner">${left}</div></div>
         <div class="pane pane-r"><div class="pane-inner">${head + stem + body + expl}</div></div>
       </div></div>`
    : `<div class="stage" id="stage"><div class="split">
         <div class="pane"><div class="pane-inner">
           ${head}${left ? left + '<div style="height:20px"></div>' : ''}${stem + body + expl}
         </div></div>
       </div></div>`;

  /* ── bottom bar ── */
  const answered = S.ans.filter(a => a !== null && a !== '').length;
  const lastLabel = S.mode === 'section' ? 'Submit' : 'See results';
  const nextLabel = S.i < n - 1 ? 'Next' : lastLabel;
  const nextBlock = instant() && !done && S.i === n - 1;

  const bottom = `
    <div class="bottombar">
      <button class="whoami" onclick="renameStudent()" title="Click to change">${esc(store.name)}</button>
      <button class="navpop" onclick="openNavigator()">
        Question ${S.i + 1} of ${n} <span style="opacity:.6">▲</span>
      </button>
      <div class="end">
        <button class="btn btn-ghost" onclick="jump(${S.i - 1})" ${S.i === 0 ? 'disabled' : ''}>Back</button>
        <button class="btn btn-primary" onclick="advance()" ${nextBlock ? 'disabled' : ''}>${nextLabel}</button>
      </div>
    </div>`;

  document.getElementById('s-quiz').innerHTML = `
    <div class="testshell">
      <div class="topbar">
        <div><div class="sect">${esc(S.label)}</div>
          <div class="sectsub">${S.mode === 'section' ? `${answered} of ${n} answered` : esc(q.skill)}</div></div>
        ${timer}
        ${tools}
      </div>
      ${stage}
      ${bottom}
    </div>`;

  if(q.type === 'grid'){
    const inp = document.getElementById('gridfield');
    if(inp && !done) inp.focus();
  }
}

function choicesHTML(q){
  const done = instant() && S.checked[S.i];
  return '<div class="choices">' + q.ch.map((c, i) => {
    const picked = S.ans[S.i] === i;
    const struck = S.struck[S.i].includes(i);
    let cls = '';
    if(done){
      if(i === q.ans) cls = 'right';
      else if(picked) cls = 'wrongpick';
    } else if(picked) cls = 'picked';
    if(struck && !done) cls += ' struck';

    const strikeBtn = (S.abc && !done)
      ? `<span class="strike ${struck ? 'undo' : ''}" role="button" tabindex="0"
              onclick="event.stopPropagation();strike(${i})"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.stopPropagation();event.preventDefault();strike(${i})}"
              title="${struck ? 'Undo cross-out' : 'Cross out'}">${struck ? '↺' : LTR[i]}</span>`
      : '<span></span>';

    return `<button class="choice ${cls}" onclick="choose(${i})" ${done ? 'disabled' : ''}>
      <span class="ltr">${LTR[i]}</span>
      <span class="body">${mx(c)}</span>
      ${strikeBtn}
    </button>`;
  }).join('') + '</div>';
}

function gridHTML(q){
  const done = instant() && S.checked[S.i];
  const val = S.ans[S.i] == null ? '' : S.ans[S.i];
  const cls = done ? (gridCorrect(val, q.ans) ? 'right' : 'wrongpick') : '';
  return `<div class="gridin">
    <label for="gridfield">Student-produced response</label>
    <input id="gridfield" class="${cls}" type="text" inputmode="text" autocomplete="off"
           spellcheck="false" maxlength="12" value="${esc(val)}" ${done ? 'disabled' : ''}
           placeholder="e.g. 7, 1.75, 3/8"
           oninput="gridInput(this.value)"
           onkeydown="if(event.key==='Enter'){event.preventDefault();${instant() ? 'checkGrid()' : 'advance()'}}">
    <div class="preview" id="gridprev"></div>
    <div class="hint">Fractions and decimals both count. Negative values use a leading minus. If the answer
    repeats, four digits is enough.</div>
    ${instant() && !done
      ? `<button class="btn btn-ghost" onclick="checkGrid()" style="justify-self:start">Check answer</button>`
      : ''}
  </div>`;
}

function explHTML(q){
  const right = q.type === 'grid'
    ? gridCorrect(S.ans[S.i], q.ans)
    : S.ans[S.i] === q.ans;
  const key = q.type === 'grid'
    ? gridDisplay(q.ans)
    : LTR[q.ans] + ' — ' + q.ch[q.ans];
  return `<div class="expl ${right ? 'good' : 'bad'}">
    <div class="hd">${right ? '✓ Correct' : '✕ Correct answer: ' + mx(key)}</div>
    <div class="bd">${mx(q.expl)}</div>
  </div>`;
}

/* ── answering ──────────────────────────────────────────────────────────── */
function choose(i){
  if(instant() && S.checked[S.i]) return;
  if(S.struck[S.i].includes(i)) return;
  S.ans[S.i] = i;
  if(instant()) commit();
  renderQuiz();
}
function gridInput(v){
  S.ans[S.i] = v;
  const p = document.getElementById('gridprev');
  if(!p) return;
  const n = parseGrid(v);
  p.textContent = (v && !Number.isNaN(n) && n !== null) ? '= ' + parseFloat(n.toFixed(6)) : '';
}
function checkGrid(){
  if(S.checked[S.i]) return;
  const v = S.ans[S.i];
  if(v == null || String(v).trim() === '') return;
  commit(); renderQuiz();
}
function commit(){
  const q = S.list[S.i];
  const right = q.type === 'grid' ? gridCorrect(S.ans[S.i], q.ans) : S.ans[S.i] === q.ans;
  S.checked[S.i] = true;
  recordSkill(q.skill, right);
  recordMiss(q.id, right);
}
function strike(i){
  const a = S.struck[S.i], k = a.indexOf(i);
  if(k >= 0) a.splice(k, 1);
  else { a.push(i); if(S.ans[S.i] === i) S.ans[S.i] = null; }
  renderQuiz();
}
function toggleAbc(){ S.abc = !S.abc; renderQuiz(); }
function toggleFlag(){ S.flagged[S.i] = !S.flagged[S.i]; renderQuiz(); }
function jump(i){
  if(i < 0 || i >= S.list.length) return;
  S.i = i; closeModal(); renderQuiz();
}
function advance(){
  if(S.i < S.list.length - 1){ S.i++; renderQuiz(); }
  else finish();
}
function renameStudent(){
  const v = prompt('Name shown on the test screen:', store.name);
  if(v && v.trim()){ store.name = v.trim().slice(0, 28); save('name', store.name); renderQuiz(); }
}
function quitQuiz(){
  const partial = S.checked.some(Boolean) || S.ans.some(a => a !== null && a !== '');
  if(partial && !confirm('Leave this session? Progress on it will not be saved.')) return;
  stopClock(); goHome();
}

/* ── clock ──────────────────────────────────────────────────────────────── */
function startClock(){
  stopClock();
  S.tick = setInterval(() => {
    S.left--;
    const el = document.getElementById('tdisp');
    if(el && !S.hideTimer){
      el.textContent = clock(S.left);
      el.classList.toggle('warn', S.left <= 300);
    }
    if(S.left <= 0){ stopClock(); finish(true); }
  }, 1000);
}
function stopClock(){ if(S.tick){ clearInterval(S.tick); S.tick = null; } }
function toggleTimer(){ S.hideTimer = !S.hideTimer; renderQuiz(); }

/* ── modals ─────────────────────────────────────────────────────────────── */
function openModal(html, wide){
  const box = document.getElementById('modalbox');
  box.className = 'modal' + (wide ? ' wide' : '');
  box.innerHTML = html;
  document.getElementById('scrim').hidden = false;
}
function closeModal(){ document.getElementById('scrim').hidden = true; }
function closeModalFromScrim(e){ if(e.target.id === 'scrim') closeModal(); }

function openNavigator(){
  const cells = S.list.map((q, i) => {
    const has = S.ans[i] !== null && S.ans[i] !== '';
    return `<button class="navcell ${has ? 'done' : ''} ${i === S.i ? 'here' : ''}" onclick="jump(${i})">
      ${i + 1}${S.flagged[i] ? '<span class="fl">⚑</span>' : ''}
    </button>`;
  }).join('');
  const openCount = S.ans.filter(a => a === null || a === '').length;
  openModal(`
    <div class="modalhd"><h3>${esc(S.label)}</h3>
      <button class="iconbtn" onclick="closeModal()" aria-label="Close">✕</button></div>
    <div class="modalbd">
      <div class="navkey">
        <span><i style="border:1.5px dashed var(--line-2)"></i>Unanswered</span>
        <span><i style="background:var(--accent)"></i>Answered</span>
        <span><i style="box-shadow:0 0 0 2px var(--ink);background:var(--surface)"></i>Current</span>
        <span style="color:var(--flag)">⚑ Marked for review</span>
      </div>
      <div class="navgrid">${cells}</div>
    </div>
    <div class="modalft">
      <span style="margin-right:auto;align-self:center;font-size:13px;color:var(--ink-3)">
        ${openCount ? openCount + ' unanswered' : 'All answered'}</span>
      <button class="btn btn-ghost" onclick="closeModal()">Keep working</button>
      <button class="btn btn-primary" onclick="closeModal();finish()">
        ${S.mode === 'section' ? 'Submit section' : 'See results'}</button>
    </div>`, true);
}

function openDirections(){
  const rw = S.sec === 'rw';
  openModal(`
    <div class="modalhd"><h3>Directions</h3>
      <button class="iconbtn" onclick="closeModal()" aria-label="Close">✕</button></div>
    <div class="modalbd" style="font-family:var(--serif);font-size:15.5px;line-height:1.65;color:var(--ink-2)">
      ${rw ? `<p>The questions in this section address a number of important reading and writing skills.
        Each question includes one or more passages, which may include a table or graph. Read each
        passage and question carefully, then choose the best answer to the question based on the
        passage or passages.</p>
        <p style="margin-top:12px">All questions in this section are multiple-choice with four answer
        options. Each question has a single best answer.</p>`
      : `<p>The questions in this section address important math skills. Use of a calculator is
        permitted for all questions.</p>
        <p style="margin-top:12px"><b>Notes:</b> All variables and expressions represent real numbers
        unless otherwise indicated. Figures are drawn to scale unless otherwise indicated. All figures
        lie in a plane unless otherwise indicated. The domain of a given function is the set of all real
        numbers for which the function is defined, unless otherwise indicated.</p>
        <p style="margin-top:12px">For <b>student-produced response</b> questions, enter your answer in
        the box. Fractions and decimals are both accepted. If your answer is a repeating decimal, give at
        least four digits.</p>`}
    </div>
    <div class="modalft"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`);
}

function openReference(){
  const f = (formula, name) => `<div class="refcard"><div class="f">${mx(formula)}</div><div class="n">${name}</div></div>`;
  openModal(`
    <div class="modalhd"><h3>Reference</h3>
      <button class="iconbtn" onclick="closeModal()" aria-label="Close">✕</button></div>
    <div class="modalbd">
      <div class="refgrid">
        ${f('A = πr\\p{2}', 'Circle area')}
        ${f('C = 2πr', 'Circumference')}
        ${f('A = ℓw', 'Rectangle area')}
        ${f('A = \\f{1}{2}bh', 'Triangle area')}
        ${f('c\\p{2} = a\\p{2} + b\\p{2}', 'Pythagorean theorem')}
        ${f('V = ℓwh', 'Rectangular solid')}
        ${f('V = πr\\p{2}h', 'Cylinder')}
        ${f('V = \\f{4}{3}πr\\p{3}', 'Sphere')}
        ${f('V = \\f{1}{3}πr\\p{2}h', 'Cone')}
        ${f('V = \\f{1}{3}ℓwh', 'Pyramid')}
        ${f('x, x\\r{3}, 2x', '30°–60°–90° sides')}
        ${f('s, s, s\\r{2}', '45°–45°–90° sides')}
      </div>
      <div class="refnote">
        <ul>
          <li>The number of degrees of arc in a circle is 360.</li>
          <li>The number of radians of arc in a circle is 2π.</li>
          <li>The sum of the measures in degrees of the angles of a triangle is 180.</li>
        </ul>
      </div>
    </div>
    <div class="modalft"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`, true);
}

/* ── finishing ──────────────────────────────────────────────────────────── */
function isRight(q, a){
  if(a === null || a === '') return null;              // skipped
  return q.type === 'grid' ? gridCorrect(a, q.ans) : a === q.ans;
}

function finish(timeUp){
  stopClock();
  // Section mode defers scoring to submit, so record it all now.
  if(!instant()){
    S.list.forEach((q, i) => {
      const r = isRight(q, S.ans[i]);
      if(r === null) return;
      recordSkill(q.skill, r);
      recordMiss(q.id, r);
    });
  }
  const correct = S.list.filter((q, i) => isRight(q, S.ans[i]) === true).length;
  recordSession({
    label:S.label, mode:S.mode, sec:S.sec,
    correct, total:S.list.length, pct:pct(correct, S.list.length),
    ts:Date.now()
  });
  renderResults(timeUp);
  show('done');
}

/* rough raw-to-scaled anchors, linearly interpolated */
const SCALE = {
  rw:  [[0,200],[5,280],[10,350],[15,410],[20,460],[25,510],[30,550],[35,600],[40,640],[45,690],[50,740],[54,800]],
  math:[[0,200],[5,310],[10,400],[15,470],[20,530],[25,580],[30,630],[35,690],[40,750],[44,800]]
};
function scaledScore(sec, correct){
  const a = SCALE[sec]; if(!a) return null;
  for(let i = 0; i < a.length - 1; i++){
    if(correct <= a[i+1][0]){
      const [x0,y0] = a[i], [x1,y1] = a[i+1];
      return Math.round((y0 + (y1 - y0) * ((correct - x0) / (x1 - x0))) / 10) * 10;
    }
  }
  return 800;
}

function renderResults(timeUp){
  const qs = S.list, n = qs.length;
  const correct = qs.filter((q,i) => isRight(q, S.ans[i]) === true).length;
  const wrong   = qs.filter((q,i) => isRight(q, S.ans[i]) === false).length;
  const skipped = n - correct - wrong;
  const p = pct(correct, n);
  const b = band(p);
  const hue = { great:'var(--ok)', good:'var(--accent)', mid:'var(--flag)', low:'var(--bad)' }[b];

  const R = 58, C = 2 * Math.PI * R;
  const dial = `<div class="dial">
    <svg viewBox="0 0 132 132" width="132" height="132" aria-hidden="true">
      <circle cx="66" cy="66" r="${R}" fill="none" style="stroke:var(--surface-3)" stroke-width="11"/>
      <circle cx="66" cy="66" r="${R}" fill="none" style="stroke:${hue}" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p/100)}"/>
    </svg>
    <div class="mid"><div class="pct" style="color:${hue}">${p}%</div><div class="frac">${correct} / ${n}</div></div>
  </div>`;

  const msg = timeUp ? 'Time called.'
    : p >= 85 ? 'That is section-score territory.'
    : p >= 70 ? 'Solid. The misses below are the whole lesson.'
    : p >= 50 ? 'Real progress. Work the explanations, not the score.'
    : 'Early days on this material — read every explanation below.';

  // per-skill breakdown for this session
  const bySkill = {};
  qs.forEach((q,i) => {
    const r = isRight(q, S.ans[i]);
    const s = bySkill[q.skill] || (bySkill[q.skill] = { n:0, c:0, dom:q.dom });
    s.n++; if(r === true) s.c++;
  });
  const rows = Object.entries(bySkill)
    .sort((a,z) => (a[1].c/a[1].n) - (z[1].c/z[1].n))
    .map(([sk, v]) => {
      const sp = pct(v.c, v.n);
      return `<div class="bkrow">
        <span class="nm">${esc(sk)}<small>${esc(v.dom)}</small></span>
        <span class="bkbar ${barBand(sp)}"><i style="width:${sp}%"></i></span>
        <span class="vv">${v.c}/${v.n}</span>
      </div>`;
    }).join('');

  const est = (S.mode === 'section' && SCALE[S.sec])
    ? (() => {
        const s = scaledScore(S.sec, correct);
        return `<div class="callout" style="margin-top:18px">
          <b>Rough section estimate: ${s - 30}–${s + 30}</b> — this module is fixed rather than adaptive,
          so the real thing could land either side of that. The per-skill rows above are the part worth acting on.
        </div>`;
      })()
    : '';

  const review = qs.map((q,i) => {
    const r = isRight(q, S.ans[i]);
    const cls = r === null ? 'sk' : r ? 'ok' : 'no';
    const tick = r === null ? '○' : r ? '✓' : '✕';
    const yours = S.ans[i] === null || S.ans[i] === '' ? '—'
      : q.type === 'grid' ? esc(S.ans[i]) : LTR[S.ans[i]];
    const key = q.type === 'grid' ? gridDisplay(q.ans) : LTR[q.ans];
    return `<div class="revitem ${cls}">
      <button class="revhd" onclick="toggleRev(${i})" aria-expanded="false">
        <span class="tick ${cls}">${tick}</span>
        <span class="n">${i + 1}</span>
        <span class="t">${esc(String(q.q).replace(/<[^>]*>/g,'').slice(0, 90))}</span>
        <span class="sk2">${esc(q.skill)}</span>
      </button>
      <div class="revbd" id="rev${i}" hidden>
        <div class="pt">${renderStim(q.stim)}</div>
        <div class="qstem" style="margin:0">${mx(q.q)}</div>
        ${q.type === 'grid' ? '' :
          `<div class="choices">${q.ch.map((c,k) =>
            `<div class="choice ${k === q.ans ? 'right' : (k === S.ans[i] ? 'wrongpick' : '')}" style="cursor:default">
               <span class="ltr">${LTR[k]}</span><span class="body">${mx(c)}</span><span></span></div>`).join('')}</div>`}
        <div class="answerline">
          <span>Your answer: <b>${yours}</b></span>
          <span>Correct: <b>${mx(key)}</b></span>
        </div>
        <div class="expl"><div class="hd" style="color:var(--accent)">Why</div>
          <div class="bd">${mx(q.expl)}</div></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('s-done').innerHTML = `
  <div class="wrap">
    <div class="scorehead">
      ${dial}
      <div class="msg">
        <div class="eyebrow">${esc(S.label)} · ${S.mode === 'section' ? 'timed section' : S.mode === 'missed' ? 'rematch' : 'drill'}</div>
        <h2>${msg}</h2>
        <div class="tally">
          <div class="c"><b>${correct}</b><span>Correct</span></div>
          <div class="w"><b>${wrong}</b><span>Incorrect</span></div>
          <div class="s"><b>${skipped}</b><span>Skipped</span></div>
        </div>
      </div>
    </div>
    ${est}

    <div class="rule"><span class="eyebrow">By skill, weakest first</span></div>
    <div class="bkdown">${rows}</div>

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:26px">
      <button class="btn btn-primary" onclick="repeat()">${S.mode === 'section' ? 'New section' : 'Another set'}</button>
      ${store.missed.length ? `<button class="btn btn-ghost" onclick="startMissed()">Rematch ${store.missed.length} missed</button>` : ''}
      <button class="btn btn-ghost" onclick="goProgress()">Progress</button>
      <button class="btn btn-quiet" onclick="goHome()">Home</button>
    </div>

    <div class="rule"><span class="eyebrow">Every question</span>
      <button class="btn btn-quiet" style="flex:none" onclick="expandAll()">Expand all</button></div>
    <div class="rev">${review}</div>
  </div>`;
  markNav('');
}
function toggleRev(i){
  const el = document.getElementById('rev' + i);
  el.hidden = !el.hidden;
  el.previousElementSibling.setAttribute('aria-expanded', String(!el.hidden));
}
function expandAll(){
  document.querySelectorAll('.revbd').forEach(el => {
    el.hidden = false;
    el.previousElementSibling.setAttribute('aria-expanded', 'true');
  });
}
function repeat(){
  if(S.mode === 'section') goSection();
  else if(S.mode === 'missed') store.missed.length ? startMissed() : goHome();
  else startDrill();
}

/* ── progress ───────────────────────────────────────────────────────────── */
function goProgress(){
  const h = store.history;
  const seen  = Object.values(store.skills).reduce((n,s) => n + s.seen, 0);
  const right = Object.values(store.skills).reduce((n,s) => n + s.right, 0);

  const domBlocks = ['rw','math'].map(sec => {
    const blocks = DOMAINS[sec].map(d => {
      const rows = d.skills.map(sk => {
        const r = store.skills[sk];
        if(!r || !r.seen) return `<div class="bkrow" style="opacity:.45">
          <span class="nm">${esc(sk)}<small>not attempted</small></span>
          <span class="bkbar"><i style="width:0"></i></span><span class="vv">—</span></div>`;
        const p = Math.round(r.right / r.seen * 100);
        return `<div class="bkrow">
          <span class="nm">${esc(sk)}</span>
          <span class="bkbar ${barBand(p)}"><i style="width:${p}%"></i></span>
          <span class="vv">${p}%</span></div>`;
      }).join('');
      return `<div class="domain"><div class="domainhd"><h3>${esc(d.name)}</h3>
        <span class="pctag">${d.share}</span></div><div class="bkdown">${rows}</div></div>`;
    }).join('');
    return `<div class="rule"><span class="eyebrow">${BLUEPRINT[sec].label}</span></div>${blocks}`;
  }).join('');

  const sess = h.length ? `<div class="sess">${h.slice(0, 25).map(e => `
      <div class="sessrow">
        <div><div class="nm">${esc(e.label)}</div>
          <div class="dt">${new Date(e.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})} ·
          ${new Date(e.ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</div></div>
        <span class="md">${e.mode}</span>
        <span class="sc ${band(e.pct)}">${e.pct}% · ${e.correct}/${e.total}</span>
      </div>`).join('')}</div>`
    : `<div class="blank-state"><b>Nothing here yet</b>
        <span>Finish a drill or a section and it shows up here.</span></div>`;

  document.getElementById('s-prog').innerHTML = `
  <div class="wrap">
    <div class="eyebrow">Progress</div>
    <h1 class="h1" style="margin:6px 0 18px">Where the points are</h1>
    <div class="cards">
      <div class="card"><b class="tnum">${h.length}</b><span>sessions</span></div>
      <div class="card"><b class="tnum">${seen}</b><span>questions answered</span></div>
      <div class="card"><b class="tnum">${seen ? pct(right, seen) + '%' : '—'}</b><span>overall accuracy</span></div>
      <div class="card"><b class="tnum">${store.missed.length}</b><span>awaiting rematch</span></div>
    </div>
    ${store.missed.length ? `<div style="margin-top:14px">
      <button class="btn btn-primary" onclick="startMissed()">Rematch ${store.missed.length} missed question${store.missed.length===1?'':'s'}</button>
    </div>` : ''}
    ${domBlocks}
    <div class="rule"><span class="eyebrow">Recent sessions</span></div>
    ${sess}
    ${h.length || seen ? `<div style="margin-top:22px">
      <button class="btn btn-quiet" onclick="wipe()">Reset all progress</button></div>` : ''}
  </div>`;
  markNav('progress'); show('prog');
}
function wipe(){
  if(!confirm('Erase every session, skill record and missed question? This cannot be undone.')) return;
  ['history','skills','missed'].forEach(k => { try{ localStorage.removeItem(KEY + k); }catch(e){} });
  store.history = []; store.skills = {}; store.missed = [];
  goProgress();
}

/* ── keyboard ───────────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if(!document.getElementById('scrim').hidden && e.key === 'Escape'){ closeModal(); return; }
  if(!document.getElementById('s-quiz').classList.contains('active')) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const q = S.list[S.i];
  if(e.key === 'ArrowRight'){ e.preventDefault(); advance(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); jump(S.i - 1); }
  else if(q && q.type !== 'grid' && /^[a-dA-D]$/.test(e.key)){
    e.preventDefault(); choose('abcd'.indexOf(e.key.toLowerCase()));
  }
});

/* ---- 90-init.js ---- */
/* ── init ───────────────────────────────────────────────────────────────── */
applyTheme();
goHome();

</script>
