<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Digital SAT practice in the real test's question formats.">
<title>Grid-In</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">

<style>
/* ── tokens ─────────────────────────────────────────────────────────────────
   Bare :root carries the complete light palette. The two blocks after it
   redefine tokens only, so an OS preference and an explicit toggle each win
   in their own direction.                                                    */
:root{
  color-scheme:light;

  --ground:#FAFBFC;
  --surface:#FFFFFF;
  --surface-2:#F1F4F8;
  --surface-3:#E5E9F0;

  --ink:#151A22;
  --ink-2:#414B5A;
  --ink-3:#6B7686;
  --ink-4:#98A2B0;

  --line:#D6DBE3;
  --line-2:#B4BCC8;
  --line-3:#8E97A4;

  --accent:#2B3FA8;
  --accent-2:#1E2C79;
  --accent-soft:#E9ECFA;
  --accent-line:#B5BFEA;
  --on-accent:#FFFFFF;

  --ok:#12704A;      --ok-soft:#E2F2EA;   --ok-line:#A4D5C0;
  --bad:#AF2318;     --bad-soft:#FCEAE8;  --bad-line:#EBB3AD;
  --flag:#A8640B;    --flag-soft:#FDF2E1; --flag-line:#E7C692;

  --s1:#2B3FA8;      /* chart series 1 */
  --s2:#C77B00;      /* chart series 2 */
  --grid:#E2E6EC;

  --shadow-1:0 1px 2px rgba(18,24,38,.06),0 1px 1px rgba(18,24,38,.04);
  --shadow-2:0 8px 24px rgba(18,24,38,.10),0 2px 6px rgba(18,24,38,.06);
  --shadow-3:0 24px 60px rgba(18,24,38,.22);

  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;

  --topbar-h:58px;
  --bottombar-h:66px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1218; --surface:#161A22; --surface-2:#1D222C; --surface-3:#272E3A;
    --ink:#E9EDF3; --ink-2:#B6C0CD; --ink-3:#8A94A3; --ink-4:#69737F;
    --line:#2B323E; --line-2:#3C4553; --line-3:#59626F;
    --accent:#93A7FF; --accent-2:#B8C5FF; --accent-soft:#1B2340; --accent-line:#374679;
    --on-accent:#0F1218;
    --ok:#5FD3A0;  --ok-soft:#12271E;   --ok-line:#2A5942;
    --bad:#FF958B; --bad-soft:#2B1716;  --bad-line:#6A312C;
    --flag:#E8B562;--flag-soft:#292012; --flag-line:#5B4521;
    --s1:#8FA3FF;  --s2:#E8A33D;
    --grid:#252B35;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 8px 24px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
    --shadow-3:0 24px 60px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1218; --surface:#161A22; --surface-2:#1D222C; --surface-3:#272E3A;
  --ink:#E9EDF3; --ink-2:#B6C0CD; --ink-3:#8A94A3; --ink-4:#69737F;
  --line:#2B323E; --line-2:#3C4553; --line-3:#59626F;
  --accent:#93A7FF; --accent-2:#B8C5FF; --accent-soft:#1B2340; --accent-line:#374679;
  --on-accent:#0F1218;
  --ok:#5FD3A0;  --ok-soft:#12271E;   --ok-line:#2A5942;
  --bad:#FF958B; --bad-soft:#2B1716;  --bad-line:#6A312C;
  --flag:#E8B562;--flag-soft:#292012; --flag-line:#5B4521;
  --s1:#8FA3FF;  --s2:#E8A33D;
  --grid:#252B35;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 8px 24px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --shadow-3:0 24px 60px rgba(0,0,0,.7);
}

/* ── base ───────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.screen{display:none}
.screen.active{display:block}
h1,h2,h3{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ── site chrome (home / progress / setup screens) ──────────────────────── */
.sitenav{
  position:sticky;top:0;z-index:60;background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;
}
body.in-test .sitenav{display:none}
.brand{
  display:flex;align-items:baseline;gap:8px;margin-right:auto;
  font-weight:700;letter-spacing:-.015em;font-size:17px;
}
.brand .mark{
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;
  color:var(--on-accent);background:var(--accent);
  padding:3px 6px;border-radius:4px;
}
.navlinks{display:flex;gap:2px}
.navbtn{
  background:none;border:none;padding:7px 12px;border-radius:7px;
  font-size:14px;font-weight:500;color:var(--ink-3);
}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent-2)}
.iconbtn{
  background:none;border:1px solid var(--line);border-radius:8px;
  width:34px;height:34px;display:grid;place-items:center;
  color:var(--ink-3);font-size:15px;flex:none;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}

.wrap{max-width:920px;margin:0 auto;padding:32px 20px 72px}
.wrap-wide{max-width:1080px}

/* ── type scale ─────────────────────────────────────────────────────────── */
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);
}
.h1{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:20px;font-weight:650;letter-spacing:-.012em}
.h3{font-size:16px;font-weight:600;letter-spacing:-.008em}
.sub{color:var(--ink-3);font-size:15px;line-height:1.55}
.rule{
  display:flex;align-items:baseline;gap:12px;
  margin:36px 0 16px;
}
.rule::after{content:"";flex:1;height:1px;background:var(--line)}
.rule .eyebrow{flex:none}

/* ── home ───────────────────────────────────────────────────────────────── */
.hero{display:grid;gap:14px;padding:14px 0 4px;max-width:64ch}
.hero .h1{font-size:34px}
.statline{
  display:flex;flex-wrap:wrap;gap:0;margin-top:6px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  overflow:hidden;
}
.statline div{
  flex:1 1 120px;padding:12px 16px;border-right:1px solid var(--line);
}
.statline div:last-child{border-right:none}
.statline b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em}
.statline span{font-size:12px;color:var(--ink-3)}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mode{
  display:grid;gap:7px;align-content:start;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:20px;transition:border-color .15s,box-shadow .15s,transform .15s;
}
.mode:hover{border-color:var(--accent-line);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.mode .kicker{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--accent);text-transform:uppercase;
}
.mode h3{font-size:17px;font-weight:650;letter-spacing:-.012em}
.mode p{font-size:13.5px;color:var(--ink-3);line-height:1.55}
.mode .meta{
  margin-top:4px;font-size:12px;color:var(--ink-4);
  font-family:var(--mono);
}
.mode[disabled]{opacity:.5;cursor:default}
.mode[disabled]:hover{border-color:var(--line);box-shadow:none;transform:none}

/* Blueprint strip: the real section composition, as a proportional bar. */
.bp{display:grid;gap:10px;margin-top:6px}
.bprow{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.bprow > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.bpbar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px}
.bpseg{
  display:grid;place-items:center;font-size:10.5px;font-weight:600;
  color:var(--on-accent);background:var(--accent);
  overflow:hidden;white-space:nowrap;
}
.bpseg:nth-child(2){background:color-mix(in srgb,var(--accent) 78%,var(--surface))}
.bpseg:nth-child(3){background:color-mix(in srgb,var(--accent) 56%,var(--surface))}
.bpseg:nth-child(4){background:color-mix(in srgb,var(--accent) 36%,var(--surface));color:var(--ink)}

/* ── skill picker ───────────────────────────────────────────────────────── */
.domain{margin-bottom:26px}
.domainhd{
  display:flex;align-items:baseline;gap:10px;
  padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line);
}
.domainhd h3{font-size:15px;font-weight:650}
.domainhd .pctag{
  font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-left:auto;
}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px}
.skill{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;text-align:left;transition:border-color .12s,background .12s;
}
.skill:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.skill.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.skill .nm{font-size:13.5px;font-weight:550;line-height:1.35}
.skill .ct{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.skill.on .ct{color:var(--accent-2)}
.skill .acc{
  grid-column:1/-1;height:3px;border-radius:2px;background:var(--surface-3);
  overflow:hidden;
}
.skill .acc i{display:block;height:100%;background:var(--ok)}
.skill .acc.weak i{background:var(--bad)}
.skill .acc.mid i{background:var(--flag)}

.pickbar{
  position:sticky;bottom:0;margin-top:22px;padding:14px 0;
  background:linear-gradient(to top,var(--ground) 72%,transparent);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn{
  border:1px solid transparent;border-radius:8px;padding:9px 18px;
  font-size:14px;font-weight:600;letter-spacing:-.005em;
  transition:background .13s,border-color .13s,color .13s;
}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2)}
.btn-primary[disabled]{background:var(--surface-3);color:var(--ink-4);cursor:default}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line-2);color:var(--ink)}
.btn-quiet{background:none;color:var(--ink-3);padding:9px 12px}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn-lg{padding:12px 26px;font-size:15px;border-radius:9px}
.btn-pill{border-radius:999px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{
  background:none;border:none;border-radius:7px;padding:6px 14px;
  font-size:13px;font-weight:600;color:var(--ink-3);
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

/* ── test shell ─────────────────────────────────────────────────────────── */
.testshell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ground)}
.topbar{
  flex:none;height:var(--topbar-h);display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);
}
.topbar .sect{font-size:14px;font-weight:600}
.topbar .sectsub{font-size:12px;color:var(--ink-3);font-weight:400}
.clock{display:grid;justify-items:center;gap:3px}
.clock .t{
  font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.clock .t.warn{color:var(--bad)}
.clock .t.hidden-t{letter-spacing:.3em;color:var(--ink-4)}
.clock button{
  background:none;border:1px solid var(--line);border-radius:999px;
  font-size:10.5px;font-weight:600;color:var(--ink-3);padding:1px 9px;
}
.clock button:hover{border-color:var(--line-2);color:var(--ink)}
.tools{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.tool{
  display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);
  border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.tool:hover{background:var(--surface-2);border-color:var(--line-2)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}

.stage{flex:1;min-height:0;overflow:auto}
.split{display:block}
.pane{padding:26px 26px 40px}
.pane-r{border-left:none}

@media (min-width:900px){
  .stage.is-split{overflow:hidden}
  .stage.is-split .split{display:grid;grid-template-columns:1fr 1fr;height:100%}
  .stage.is-split .pane{overflow:auto;padding:30px 34px 56px}
  .stage.is-split .pane-r{border-left:1px dashed var(--line-2)}
}
.pane-inner{max-width:62ch;margin:0 auto}
.stage:not(.is-split) .pane-inner{max-width:66ch}

.bottombar{
  flex:none;height:var(--bottombar-h);display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:0 18px;background:var(--surface);border-top:1px solid var(--line);
}
.whoami{
  font-size:13px;font-weight:600;color:var(--ink-2);
  background:none;border:none;padding:4px 6px;border-radius:6px;
  justify-self:start;text-align:left;
}
.whoami:hover{background:var(--surface-2);color:var(--ink)}
.navpop{
  background:var(--ink);color:var(--ground);border:none;border-radius:8px;
  padding:9px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;
}
.navpop:hover{opacity:.88}
.bottombar .end{display:flex;gap:9px;justify-content:flex-end}

/* ── question content ───────────────────────────────────────────────────── */
.qhead{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:11px;margin-bottom:16px;border-bottom:1px solid var(--line);
}
.qnum{
  width:26px;height:26px;border-radius:5px;background:var(--ink);color:var(--ground);
  display:grid;place-items:center;font-size:13px;font-weight:650;flex:none;
  font-variant-numeric:tabular-nums;
}
.markbtn{
  display:flex;align-items:center;gap:6px;background:none;border:none;
  font-size:12.5px;font-weight:600;color:var(--ink-3);padding:4px 6px;border-radius:6px;
}
.markbtn:hover{background:var(--surface-2);color:var(--ink)}
.markbtn.on{color:var(--flag)}
.markbtn .fl{font-size:13px}
.abcbtn{
  margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;
  border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:none;
  color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px;
}
.abcbtn:hover{border-color:var(--line-2);color:var(--ink)}
.abcbtn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.stim{font-family:var(--serif);font-size:17px;line-height:1.68;color:var(--ink)}
.stim p+p{margin-top:14px}
.stim .blank{
  display:inline-block;min-width:5.5em;border-bottom:1.5px solid var(--ink-3);
  vertical-align:baseline;
}
.stim em,.stim i{font-style:italic}
.stim u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.stim .verse{display:block;padding-left:1.4em;text-indent:-1.4em}

.srcline{font-size:12.5px;color:var(--ink-3);margin-top:12px;font-family:var(--sans)}

/* inline math bits produced by mx() */
.frac{
  display:inline-flex;flex-direction:column;vertical-align:-.48em;
  text-align:center;font-size:.82em;line-height:1.18;margin:0 .12em;
}
.frac .num{border-bottom:1px solid currentColor;padding:0 .3em}
.frac .den{padding:0 .3em}
.rad{border-top:1px solid currentColor;padding:.06em .12em 0 .06em}
sup,sub{font-size:.72em;line-height:0}

/* bulleted research notes (rhetorical synthesis) */
.notes{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 18px}
.notes .lead{font-family:var(--serif);font-size:16px;line-height:1.6;margin-bottom:10px}
.notes ul{list-style:none;display:grid;gap:7px}
.notes li{
  position:relative;padding-left:18px;font-family:var(--serif);
  font-size:15.5px;line-height:1.55;
}
.notes li::before{
  content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;
  border-radius:50%;background:var(--ink-3);
}

/* paired texts (cross-text connections) */
.dual{display:grid;gap:14px}
.dualbox{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px 17px}
.dualbox .lbl{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);margin-bottom:7px;
}
.dualbox .stim{font-size:16px}

/* data table (quantitative evidence) */
.figure{margin:0;display:grid;gap:9px}
.figcap{
  font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.45;
}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt caption{
  caption-side:top;text-align:left;padding:11px 14px 9px;font-weight:650;font-size:13px;
  border-bottom:1px solid var(--line);
}
table.dt th,table.dt td{
  padding:8px 14px;text-align:right;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
table.dt th:first-child,table.dt td:first-child{text-align:left;font-variant-numeric:normal}
table.dt thead th{
  font-size:11.5px;font-weight:650;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.04em;background:var(--surface-2);
}
table.dt tbody tr:last-child td{border-bottom:none}
.fignote{font-size:12px;color:var(--ink-3)}

.chartwrap{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px}
.chartwrap svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-left:2px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.legend i{width:11px;height:11px;border-radius:3px;flex:none}

.figbox{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;display:grid;place-items:center}
.figbox svg{display:block;max-width:100%;height:auto}

.qstem{
  font-family:var(--serif);font-size:17px;line-height:1.6;font-weight:600;
  margin:20px 0 16px;
}
.stage.is-split .pane-r .qstem{margin-top:0}

/* ── choices ────────────────────────────────────────────────────────────── */
.choices{display:grid;gap:9px}
.choice{
  display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:12px;
  width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line-2);border-radius:9px;padding:12px 13px;
  font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink);
  transition:border-color .12s,background .12s,box-shadow .12s;
}
.choice:hover:not(:disabled):not(.struck){border-color:var(--accent);background:var(--accent-soft)}
.choice .ltr{
  width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line-3);
  display:grid;place-items:center;font-family:var(--sans);font-size:12.5px;font-weight:650;

<script>
/* ---- 10-core.js ---- */
/* ═══ core ══════════════════════════════════════════════════════════════════
   Question bank + the taxonomy the Digital SAT actually reports against.
   Each src/2*-rw-*.js and src/3*-math-*.js file pushes onto Q.

   Question shape
   ──────────────
   { id   : 'RW-WIC-01'                stable, used by the missed-question bank
     sec  : 'rw' | 'math'
     dom  : one of DOMAINS[sec]
     skill: one of the skills under that domain
     diff : 1 easy | 2 medium | 3 hard
     type : 'mcq' (default) | 'grid'
     stim : stimulus object, see renderStim()      (optional)
     q    : the question stem
     ch   : ['…','…','…','…']                      (mcq)
     ans  : index                                  (mcq)
          | { v: 7 } or { v:[7,-3] } or { v:3/8, disp:'3/8' }   (grid)
     expl : explanation, may contain inline HTML                            }
   ══════════════════════════════════════════════════════════════════════════ */
const Q = [];

const DOMAINS = {
  rw: [
    { name:'Craft and Structure', share:'~28%', skills:[
      'Words in Context', 'Text Structure and Purpose', 'Cross-Text Connections' ]},
    { name:'Information and Ideas', share:'~26%', skills:[
      'Central Ideas and Details', 'Command of Evidence: Textual',
      'Command of Evidence: Quantitative', 'Inferences' ]},
    { name:'Standard English Conventions', share:'~26%', skills:[
      'Boundaries', 'Form, Structure, and Sense' ]},
    { name:'Expression of Ideas', share:'~20%', skills:[
      'Transitions', 'Rhetorical Synthesis' ]}
  ],
  math: [
    { name:'Algebra', share:'~35%', skills:[
      'Linear equations in one variable', 'Linear functions',
      'Linear equations in two variables', 'Systems of two linear equations',
      'Linear inequalities' ]},
    { name:'Advanced Math', share:'~35%', skills:[
      'Equivalent expressions', 'Nonlinear equations and systems',
      'Nonlinear functions' ]},
    { name:'Problem-Solving and Data Analysis', share:'~15%', skills:[
      'Ratios, rates, and proportions', 'Percentages', 'One- and two-variable data',
      'Probability', 'Inference from sample statistics', 'Evaluating statistical claims' ]},
    { name:'Geometry and Trigonometry', share:'~15%', skills:[
      'Area and volume', 'Lines, angles, and triangles',
      'Right triangles and trigonometry', 'Circles' ]}
  ]
};

/* How many questions of each domain a real section contains. A generated
   section samples the bank to match these counts. */
const BLUEPRINT = {
  rw:   { total:54, minutes:64, label:'Reading and Writing', counts:{
    'Craft and Structure':15, 'Information and Ideas':14,
    'Standard English Conventions':14, 'Expression of Ideas':11 }},
  math: { total:44, minutes:70, label:'Math', counts:{
    'Algebra':15, 'Advanced Math':15,
    'Problem-Solving and Data Analysis':7, 'Geometry and Trigonometry':7 }}
};

const LTR = ['A','B','C','D'];

/* ── math typesetting ───────────────────────────────────────────────────────
   Terse authoring markup so 96 math questions stay readable in source:
     \f{3}{4}  fraction        \r{2}  radical
     \p{n+1}   superscript     \b{0}  subscript                              */
function mx(s){
  if(s == null) return '';
  return String(s)
    .replace(/\\f\{([^{}]*)\}\{([^{}]*)\}/g,
      '<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>')
    .replace(/\\r\{([^{}]*)\}/g, '√<span class="rad">$1</span>')
    .replace(/\\p\{([^{}]*)\}/g, '<sup>$1</sup>')
    .replace(/\\b\{([^{}]*)\}/g, '<sub>$1</sub>');
}

/* paragraph + blank handling for passage text */
function proseHTML(t){
  return String(t).split(/\n{2,}/).map(p =>
    '<p>' + mx(p).replace(/_{3,}/g, '<span class="blank"></span>') + '</p>'
  ).join('');
}

/* ── stimulus rendering ─────────────────────────────────────────────────── */
function renderStim(st){
  if(!st) return '';
  switch(st.kind){
    case 'text':  return stimText(st);
    case 'notes': return stimNotes(st);
    case 'dual':  return stimDual(st);
    case 'table': return stimTable(st);
    case 'chart': return stimChart(st);
    case 'fig':   return stimFig(st);
    default:      return '';
  }
}

function stimText(st){
  return '<div class="stim">' + proseHTML(st.t) + '</div>' +
    (st.src ? '<div class="srcline">' + mx(st.src) + '</div>' : '');
}

function stimNotes(st){
  return '<div class="notes">' +
    '<div class="lead">' + mx(st.lead) + '</div>' +
    '<ul>' + st.items.map(i => '<li>' + mx(i) + '</li>').join('') + '</ul>' +
  '</div>';
}

function stimDual(st){
  return '<div class="dual">' +
    '<div class="dualbox"><div class="lbl">' + (st.al || 'Text 1') + '</div>' +
      '<div class="stim">' + proseHTML(st.a) + '</div></div>' +
    '<div class="dualbox"><div class="lbl">' + (st.bl || 'Text 2') + '</div>' +
      '<div class="stim">' + proseHTML(st.b) + '</div></div>' +
  '</div>';
}

function stimTable(st){
  const head = '<tr>' + st.head.map(h => '<th scope="col">' + mx(h) + '</th>').join('') + '</tr>';
  const body = st.rows.map(r =>
    '<tr>' + r.map((c,i) =>
      i === 0 ? '<th scope="row" style="font-weight:550;color:var(--ink)">' + mx(c) + '</th>'
              : '<td>' + mx(c) + '</td>'
    ).join('') + '</tr>'
  ).join('');
  return '<figure class="figure">' +
    '<div class="tablewrap"><table class="dt">' +
      (st.cap ? '<caption>' + mx(st.cap) + '</caption>' : '') +
      '<thead>' + head + '</thead><tbody>' + body + '</tbody>' +
    '</table></div>' +
    (st.note ? '<figcaption class="fignote">' + mx(st.note) + '</figcaption>' : '') +
  '</figure>';
}

/* ── bar chart ──────────────────────────────────────────────────────────────
   One linear scale places bars, gridlines and tick labels. Values are read
   off the axis rather than printed on each bar, which is how the test does
   it. Two-series charts get a legend; colors are blue / amber, the pairing
   that survives every common form of color vision deficiency.              */
function niceMax(v){
  if(v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * mag;
}

/* rect with only its top corners rounded, anchored to the baseline */
function barPath(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} ` +
         `Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}

function stimChart(st){
  const W = 540, H = 268, mL = 52, mR = 12, mT = 16, mB = 52;
  const pw = W - mL - mR, ph = H - mT - mB;
  const series = st.series;
  const all = series.flatMap(s => s.values);
  const top = st.max || niceMax(Math.max(...all) * 1.1);
  const ticks = 4, tstep = top / ticks;
  const y = v => mT + ph - (v / top) * ph;

  let g = '';
  for(let i = 0; i <= ticks; i++){
    const v = i * tstep, yy = y(v);
    const lbl = Number.isInteger(v) ? v : parseFloat(v.toFixed(2));
    g += `<line x1="${mL}" y1="${yy}" x2="${W-mR}" y2="${yy}" style="stroke:var(--grid)" stroke-width="1"/>`;
    g += `<text x="${mL-9}" y="${yy+4}" text-anchor="end" style="fill:var(--ink-3);font:400 11px var(--sans)">${lbl}</text>`;
  }
  g += `<line x1="${mL}" y1="${mT+ph}" x2="${W-mR}" y2="${mT+ph}" style="stroke:var(--line-2)" stroke-width="1"/>`;

  const n = st.cats.length, band = pw / n;
  const ns = series.length;
  const gap = ns > 1 ? 2 : 0;
  const groupW = band * 0.62;
  const bw = (groupW - gap * (ns - 1)) / ns;
  const hue = ['var(--s1)', 'var(--s2)'];

  st.cats.forEach((c, i) => {
    const gx = mL + band * i + (band - groupW) / 2;
    series.forEach((s, k) => {
      const v = s.values[i], h = (v / top) * ph;
      const x = gx + k * (bw + gap);
      g += `<path d="${barPath(x, mT + ph - h, bw, h, 3)}" style="fill:${hue[k % 2]}"/>`;
    });
    g += `<text x="${mL + band*i + band/2}" y="${mT+ph+18}" text-anchor="middle" ` +
         `style="fill:var(--ink-2);font:500 11px var(--sans)">${c}</text>`;
  });

  if(st.xlab)
    g += `<text x="${mL+pw/2}" y="${H-8}" text-anchor="middle" style="fill:var(--ink-3);font:400 11px var(--sans)">${st.xlab}</text>`;
  if(st.ylab)
    g += `<text transform="translate(13,${mT+ph/2}) rotate(-90)" text-anchor="middle" style="fill:var(--ink-3);font:400 11px var(--sans)">${st.ylab}</text>`;

  const legend = ns > 1
    ? '<div class="legend">' + series.map((s,k) =>
        `<span><i style="background:${hue[k%2]}"></i>${s.name}</span>`).join('') + '</div>'
    : '';

  return '<figure class="figure">' +
    (st.cap ? '<figcaption class="figcap">' + mx(st.cap) + '</figcaption>' : '') +
    '<div class="chartwrap">' +
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${(st.cap||'Bar chart').replace(/"/g,'')}">${g}</svg>` +
      legend +
    '</div>' +
    (st.note ? '<div class="fignote">' + mx(st.note) + '</div>' : '') +
  '</figure>';
}

function stimFig(st){
  return '<figure class="figure">' +
    '<div class="figbox">' + st.svg + '</div>' +
    (st.cap ? '<figcaption class="fignote">' + mx(st.cap) + '</figcaption>' : '') +
  '</figure>';
}

/* ── grid-in answer checking ────────────────────────────────────────────────
   Accepts integers, decimals and fractions. The tolerance admits the test's
   own rule: a repeating decimal may be truncated or rounded at the fourth
   digit, so 2/3 accepts .6666 and .6667 alike.                             */
function parseGrid(raw){
  const s = String(raw).trim().replace(/\s+/g, '');
  if(!s) return null;
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  const f = s.match(/^(-?\d+)\/(-?\d+)$/);
  if(f && +f[2] !== 0) return (+f[1]) / (+f[2]);
  return NaN;
}
function gridCorrect(raw, ans){
  const v = parseGrid(raw);
  if(v === null || Number.isNaN(v)) return false;
  const targets = Array.isArray(ans.v) ? ans.v : [ans.v];
  return targets.some(t => Math.abs(v - t) <= 2e-4 * Math.max(1, Math.abs(t)));
}
function gridDisplay(ans){
  if(ans.disp) return ans.disp;
  const targets = Array.isArray(ans.v) ? ans.v : [ans.v];
  return targets.map(t => Number.isInteger(t) ? t : parseFloat(t.toFixed(4))).join(' or ');
}

/* ── small utilities ────────────────────────────────────────────────────── */
function shuffle(a){
  const r = [...a];
  for(let i = r.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function take(a, n){ return shuffle(a).slice(0, n); }
function pct(a, b){ return b === 0 ? 0 : Math.round((a / b) * 100); }
function clock(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function band(p){ return p >= 85 ? 'great' : p >= 70 ? 'good' : p >= 50 ? 'mid' : 'low'; }
function barBand(p){ return p >= 75 ? '' : p >= 50 ? 'mid' : 'weak'; }
function byId(id){ return Q.find(q => q.id === id); }
function skillsOf(sec){ return DOMAINS[sec].flatMap(d => d.skills); }
function inSkill(s){ return Q.filter(q => q.skill === s); }
function inDomain(d){ return Q.filter(q => q.dom === d); }

/* ── persistence ────────────────────────────────────────────────────────── */
const KEY = 'gridin.v1.';
function load(k, fb){
  try{ const v = localStorage.getItem(KEY + k); return v === null ? fb : JSON.parse(v); }
  catch(e){ return fb; }
}
function save(k, v){ try{ localStorage.setItem(KEY + k, JSON.stringify(v)); }catch(e){} }

const store = {
  history: load('history', []),   // [{label, mode, sec, correct, total, pct, ts}]
  skills:  load('skills', {}),    // { [skill]: {seen, right} }
  missed:  load('missed', []),    // [question id]
  name:    load('name', 'Student')
};

function recordSkill(skill, right){
  const s = store.skills[skill] || (store.skills[skill] = { seen:0, right:0 });
  s.seen++; if(right) s.right++;
  save('skills', store.skills);
}
function recordMiss(id, right){
  const i = store.missed.indexOf(id);
  if(right){ if(i >= 0) store.missed.splice(i, 1); }
  else if(i < 0) store.missed.push(id);
  save('missed', store.missed);
}
function recordSession(entry){
  store.history.unshift(entry);
  if(store.history.length > 80) store.history.pop();
  save('history', store.history);
}
function skillPct(s){
  const r = store.skills[s];
  return r && r.seen ? Math.round(r.right / r.seen * 100) : null;
}

/* ── theme ──────────────────────────────────────────────────────────────── */
function applyTheme(){
  const t = load('theme', 'auto');
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('themebtn');
  if(b) b.textContent = t === 'auto' ? '◐' : t === 'dark' ? '☾' : '☀';
}
function toggleTheme(){
  const order = ['auto','light','dark'];
  const t = load('theme', 'auto');
  save('theme', order[(order.indexOf(t) + 1) % order.length]);
  applyTheme();
}

  expl:'Text 2\'s last sentence is aimed straight at the cost claim: on fertilizer-altered soil, recovery "has generally required exactly what rewilding proposes to do without." The savings do not materialize where the land is degraded. <b>B</b>. Text 2 never grants that rewilding is cheap (A), never criticizes managed reserves (C), and discusses plant colonizers rather than herbivore survival (D).' },

{ ..._CTC, id:'RW-CTC-02', diff:3,
  stim:{ kind:'dual',
    a:'The steep fall in a language\'s speakers is usually read as a symptom of coercion — schooling in a dominant language, migration, official suppression. The pattern of loss supports that reading: declines cluster tightly around the decades in which such policies were imposed.',
    b:'Coercion is plainly part of the story, but it cannot be the whole of it. Communities under identical policy pressure have diverged sharply, some losing a language within two generations while neighbors a valley away retained theirs. What distinguishes them is not the pressure applied but whether the language remained the medium of something people wanted — a liturgy, a trade, a body of song.' },
  q:'Based on the texts, the author of Text 2 would most likely characterize the explanation offered in Text 1 as',
  ch:[
    'well supported but incomplete, since it cannot account for variation among similarly pressured communities',
    'fundamentally mistaken, since official policy has little measurable effect on language retention',
    'plausible for historical cases but irrelevant to languages declining today',
    'too dependent on evidence from communities that retained their languages'],

  expl:'Text 2 opens by granting the point — "coercion is plainly part of the story" — and then presses the gap: identical pressure, opposite outcomes. That is <b>well supported but incomplete</b>. B is too strong (Text 2 concedes policy matters), and the text draws no line between historical and present-day cases.' },

{ ..._CTC, id:'RW-CTC-03', diff:2,
  stim:{ kind:'dual',

    b:'Detection tools flag matching strings; they cannot tell a copied argument from a shared quotation, and they cannot see the essay a student bought outright. Yet institutions keep purchasing them, and the purchase does real work: it lets an administration point to a system when the question of integrity is raised.' },

{ ..._CTC, id:'RW-CTC-04', diff:3,

{ ..._CTC, id:'RW-CTC-05', diff:2,
  stim:{ kind:'dual',

/* ── Central Ideas and Details ────────────────────────────────────────── */
{ ..._CID, id:'RW-CID-01', diff:1,
  stim:{ kind:'text', t:'The Sahara has not always been a desert. Sediment cores drawn from the seafloor off West Africa preserve alternating bands of windblown dust and river-carried silt, and the silt layers correspond to periods lasting several thousand years in which monsoon rains reached far north of their present limit. Rock art left in what is now open desert — cattle, swimmers, hippopotamus — falls within those same intervals.' },
  q:'Which choice best states the main idea of the text?',
  ch:[
    'Rock art is a more reliable record of past climate than sediment cores are.',
    'Two independent kinds of evidence indicate that the Sahara periodically became far wetter than it is today.',
    'The monsoon has moved steadily northward over the past several thousand years.',
    'Sediment cores from the seafloor are difficult to date precisely.'],
  ans:1,
  expl:'The text offers seafloor sediment and rock art, notes that they fall in the same intervals, and concludes that the region was wetter then. That is <b>B</b>. It never ranks the two kinds of evidence (A), and the pattern described is alternating rather than a steady march north (C).' },

{ ..._CID, id:'RW-CID-02', diff:2,
  stim:{ kind:'text', t:'The conventional account of the printing press credits it with spreading new ideas. Less often noticed is what it did to old ones. Before print, a text survived only by being copied, and each copyist quietly corrected, abridged, and updated. Printing froze a version. Errors that would once have been edited out of existence in a generation were instead reproduced by the thousand, and scholars spent the following century building the apparatus — editions, variants, footnotes — needed to work back toward what an author had actually written.' },
  q:'Which choice best states the main idea of the text?',
  ch:[
    'Printed books contained more errors than manuscripts did.',
    'By fixing texts in a single version, printing preserved errors and created the need for modern scholarly editing.',
    'Medieval copyists were more skilled than early printers.',
    'The spread of new ideas mattered less than the preservation of old ones.'],
  ans:1,
  expl:'The passage\'s point is a consequence of fixity: freezing a version meant errors were mass-reproduced rather than quietly edited away, which forced scholars to invent editorial apparatus. <b>B</b>. A is a detail the text does not actually claim — a manuscript tradition accumulated errors too, it just kept correcting them — and D reverses an emphasis the text never ranks.' },

{ ..._CID, id:'RW-CID-03', diff:2,
  stim:{ kind:'text', t:'Octopuses have no rigid skeleton to push against, and each arm holds far more neurons than the central brain does. Researchers studying arm movement found that a severed arm, entirely disconnected from the animal, still reaches accurately toward a stimulus and still passes food toward where a mouth would be. The behavior appears to be organized in the arm itself, with the brain issuing a target rather than a set of instructions.' },
  q:'According to the text, what do experiments on severed octopus arms suggest?',
  ch:[
    'The central brain plays no role in the octopus\'s movement.',
    'Much of the control of an arm\'s movement resides in the arm rather than in the brain.',
    'Octopus arms regenerate more quickly than those of other invertebrates.',
    'Octopuses use their arms primarily to capture food.'],
  ans:1,
  expl:'The final sentence says the behavior is "organized in the arm itself," with the brain supplying only a target. <b>B</b>. A overshoots — the brain still issues the target, so it has a role. Regeneration and feeding priorities are never discussed.' },

{ ..._CID, id:'RW-CID-04', diff:3,
  stim:{ kind:'text', t:'Historians of the Great Migration have generally framed the movement north as flight — from lynching, from disenfranchisement, from the collapse of tenant farming. Letters written by migrants to northern newspapers complicate the framing without overturning it. Correspondents describe what they are escaping, but they spend far more lines on what they intend to do: the wage they have heard about, the church they mean to join, the schooling their children will get. The letters read less like the accounts of refugees than like the plans of people making an investment.' },
  q:'Which choice best states the main idea of the text?',
  ch:[
    'Migrants\' letters show that the dangers of the South have been exaggerated by historians.',
    'The letters suggest migration was driven more by deliberate planning than the standard "flight" framing conveys, without contradicting it.',
    'Historians have failed to consult the letters migrants wrote to northern newspapers.',
    'Most migrants wrote to northern newspapers before deciding to leave the South.'],
  ans:1,
  expl:'"Complicate the framing without overturning it" is the hinge, and the letters\' emphasis on wages, churches and schools supports planning rather than pure flight. <b>B</b> preserves both halves. A drops the concession, and C contradicts a text that is itself discussing the letters as evidence.' },

{ ..._CID, id:'RW-CID-05', diff:1,
  stim:{ kind:'text', t:'Concrete is responsible for roughly eight percent of global carbon dioxide emissions, and most of that comes not from the fuel burned in a cement kiln but from the chemistry inside it: heating limestone drives off carbon dioxide as an unavoidable product of the reaction that makes cement. Switching a kiln to renewable electricity therefore addresses only part of the problem.' },
  q:'According to the text, why would electrifying cement kilns leave a substantial share of concrete\'s emissions in place?',
  ch:[
    'Renewable electricity is not yet available in most regions where cement is produced.',
    'Most of the carbon dioxide is released by the limestone reaction itself, not by burning fuel.',
    'Electric kilns cannot reach the temperatures cement production requires.',
    'Concrete production is expected to increase faster than kilns can be converted.'],
  ans:1,
  expl:'The text says explicitly that most emissions come "not from the fuel burned … but from the chemistry inside it." Changing the energy source cannot touch a reaction product. <b>B</b>. The other three are plausible-sounding obstacles the passage never raises.' },

{ ..._CID, id:'RW-CID-06', diff:2,
  stim:{ kind:'text', t:'A widely repeated claim holds that a person\'s vocabulary is essentially fixed after adolescence. Longitudinal testing tells a different story about which words are involved. Total vocabulary size does grow through middle age, but almost all of the growth is in low-frequency and domain-specific terms — the language of a trade, a hobby, a diagnosis. The everyday core, the few thousand words that carry most conversation, is indeed settled early.' },
  q:'Which choice best states the main idea of the text?',
  ch:[
    'Vocabulary growth continues well past adolescence, but it is concentrated in specialized rather than everyday words.',
    'The claim that vocabulary is fixed after adolescence is entirely mistaken.',
    'Adults in specialized professions have larger vocabularies than other adults.',
    'Longitudinal testing is the only reliable way to measure vocabulary size.'],
  ans:0,
  expl:'The text splits the difference: growth is real, but confined to low-frequency, domain-specific words, while the everyday core is settled early. <b>A</b> holds both halves. B keeps only the first and drops the concession in the last sentence.' },

{ ..._CID, id:'RW-CID-07', diff:2,
  stim:{ kind:'text', t:'Nurse logs — fallen trees on which new seedlings take root — are a familiar sight in old-growth Pacific forests, and their advantage has usually been explained by light: a downed trunk lifts a seedling above the deep shade of the forest floor. Measurements of soil chemistry point elsewhere. Decaying wood holds moisture through the dry late summer and hosts fungal networks that deliver nitrogen, and seedlings on logs outperform those on the ground even in gaps where light is abundant.' },
  q:'Which detail from the text most directly undercuts the light-based explanation?',
  ch:[
    'Nurse logs are common in old-growth Pacific forests.',
    'Decaying wood hosts fungal networks that deliver nitrogen.',
    'Seedlings on logs do better than seedlings on the ground even where light is plentiful.',
    'A downed trunk lifts a seedling above the forest floor.'],
  ans:2,
  expl:'If the advantage were about escaping shade, it should disappear where there is no shade to escape. The observation that logs still win <b>in well-lit gaps</b> is the finding that breaks the explanation. B offers an alternative mechanism, which supports the new account but does not by itself refute the old one.' },

{ ..._CID, id:'RW-CID-08', diff:3,
  stim:{ kind:'text', t:'When a jazz standard is played, the melody as written is often the one thing that does not appear. Musicians treat the printed tune as a set of coordinates — a harmonic sequence, a length, a set of expectations about where phrases will land — and the performance consists of moving through those coordinates by other means. Audiences who know the standard hear the absent melody constantly, in the shape of what is played against it. Those who do not know it hear only the surface, and often conclude that nothing is being followed at all.' },
  q:'Which choice best states the main idea of the text?',
  ch:[
    'Jazz performances are more difficult for audiences to appreciate than classical ones.',
    'A jazz standard functions as an underlying framework whose presence is audible mainly to listeners who already know the tune.',
    'Jazz musicians should play written melodies more often so audiences can follow them.',
    'Harmonic sequences are more important to jazz than melodies are.'],
  ans:1,
  expl:'The passage defines the standard as a set of coordinates played "against," then draws the consequence: knowing the tune is what makes the framework audible. <b>B</b>. C prescribes something the text does not, and D ranks two elements the text treats as working together.' },

{ ..._CID, id:'RW-CID-09', diff:2,
  stim:{ kind:'text', t:'Because a solar farm produces nothing after sunset, the value of adding one to a grid depends less on how much electricity it generates than on when. In regions where demand peaks in the late afternoon, a west-facing array that gives up some total output to keep producing later can be worth more to the system than an optimally tilted array that produces more overall.' },
  q:'According to the text, why might a west-facing solar array be preferable to an optimally tilted one?',
  ch:[
    'It generates more total electricity over the course of a year.',
    'It is less expensive to install and maintain.',
    'It shifts generation later in the day, closer to when demand peaks.',
    'It continues generating electricity for a short period after sunset.'],
  ans:2,
  expl:'The text says a west-facing array "gives up some total output to keep producing later," and that late-afternoon timing is when demand peaks. <b>C</b>. A reverses the tradeoff the sentence describes, and D contradicts the opening clause — nothing is produced after sunset.' },

/* ── Command of Evidence: Textual ─────────────────────────────────────── */
{ ..._CET, id:'RW-CET-01', diff:2,
  stim:{ kind:'text', t:'Cleaner wrasse are small reef fish that remove parasites from larger fish. Researchers noticed that a wrasse serving a client which could easily swim to a competing cleaning station worked more carefully — taking parasites and avoiding the mucus it prefers to eat — than one serving a client with no nearby alternative. They hypothesized that the wrasse adjust their behavior according to how easily a client could take its business elsewhere.' },
  q:'Which finding, if true, would most directly support the researchers\' hypothesis?',
  ch:[
    'Wrasse at stations near reef edges remove more parasites per hour than wrasse at interior stations.',
    'When a competing station was experimentally added near an isolated wrasse, that wrasse began eating less client mucus.',
    'Larger client fish carry more parasites than smaller client fish do.',
    'Wrasse can be trained to associate a colored marker with the arrival of a client.'],
  ans:1,
  expl:'The hypothesis is causal: the <i>availability of an alternative</i> changes wrasse behavior. <b>B</b> is the manipulation that tests it — hold the wrasse fixed, add a competitor, and see the cheating drop. A is correlational and confounded by everything else that differs between reef edges and interiors, and C and D bear on other questions entirely.' },

{ ..._CET, id:'RW-CET-02', diff:2,
  stim:{ kind:'text', t:'Some archaeologists argue that the elaborate stone enclosures at a highland site were used only seasonally, by groups that gathered for a few weeks and then dispersed. Others contend the site supported a permanent resident population.' },
  q:'Which finding, if true, would most directly support the seasonal-use hypothesis?',
  ch:[
    'The enclosures required substantial labor to build and would have taken several years to complete.',
    'Animal bones recovered from the site come almost entirely from individuals slaughtered in late autumn.',
    'The site contains storage pits capable of holding a year\'s supply of grain.',
    'Pottery at the site matches styles found across a wide surrounding region.'],
  ans:1,
  expl:'If the food waste all dates to one narrow slice of the year, people were eating there in that season and not the others — a direct signature of seasonal occupation. <b>B</b>. C points the other way, toward year-round residence, and A tells us about construction effort rather than occupancy. D shows contact across a region, which is consistent with either hypothesis.' },

{ ..._CET, id:'RW-CET-03', diff:3,
  stim:{ kind:'text', t:'A long-standing puzzle in developmental biology concerns how a limb bud "knows" which end becomes a shoulder and which a hand. One model holds that cells read their position from the concentration of a signaling molecule diffusing from one end of the bud, with high concentration specifying one set of structures and low concentration another. A competing model holds that cells instead count divisions since they left the bud tip, so that position is inferred from elapsed time rather than from a chemical gradient.' },
  q:'Which finding, if true, would most directly support the timing model over the gradient model?',
  ch:[
    'Removing the source of the signaling molecule prevents the limb from developing at all.',
    'Cells transplanted from the tip of an older bud into a younger bud form the structures appropriate to their original age rather than to their new position.',
    'The signaling molecule can be detected throughout the limb bud at every stage of development.',
    'Limb buds in different species vary considerably in overall size.'],
  ans:1,
  expl:'The transplant separates the two models: under a gradient model a cell dropped into a new location should read the local concentration and change fate; under a timing model it should carry its count with it. Keeping its <b>original</b> fate is the timing model\'s prediction. <b>B</b>. A only shows the molecule is necessary for something, which both models can accommodate.' },

{ ..._CET, id:'RW-CET-04', diff:2,
  stim:{ kind:'text', t:'Economists studying why some neighborhoods recover faster from a factory closure than others have proposed that the difference lies in the range of industries employing residents beforehand. On this account, a neighborhood whose workers were already spread across several sectors loses fewer of them permanently, because the skills of the displaced already match employers who remain.' },
  q:'Which finding, if true, would most directly support the economists\' proposal?',
  ch:[
    'Neighborhoods with a single dominant employer tend to have higher wages before a closure than diversified neighborhoods do.',
    'Among neighborhoods with similar closure sizes, those with more varied prior employment show smaller lasting increases in unemployment.',
    'Factory closures are more common in regions where manufacturing employment has been declining for decades.',
    'Workers who relocate after a closure typically earn less in their next job than they did before.'],
  ans:1,
  expl:'The claim links prior <i>variety</i> of employment to <i>faster recovery</i>, so the supporting evidence must compare neighborhoods on that variable while holding the shock constant — which is exactly what "similar closure sizes" does. <b>B</b>. A concerns wages before the event, and C and D describe closures and workers generally without comparing diversified and concentrated neighborhoods.' },

{ ..._CET, id:'RW-CET-05', diff:2,
  stim:{ kind:'text', t:'Because I could not stop for Death –\nHe kindly stopped for me –\nThe Carriage held but just Ourselves –\nAnd Immortality.\n\nWe slowly drove – He knew no haste\nAnd I had put away\nMy labor and my leisure too,\nFor His Civility –', src:'From Emily Dickinson, "Because I could not stop for Death" (c. 1863).' },
  q:'A student claims that the poem\'s opening stanzas present death not as an assault but as a courteous social call. Which quotation from the text most effectively illustrates this claim?',
  ch:[
    '"Because I could not stop for Death –"',
    '"He kindly stopped for me – / The Carriage held but just Ourselves –"',
    '"And Immortality."',
    '"I had put away / My labor and my leisure too,"'],
  ans:1,
  expl:'The claim has two parts — courteous, and a social call. "<b>Kindly</b>" supplies the courtesy and the shared <b>carriage</b> supplies the visit, so B illustrates both at once. A only establishes that the speaker was busy; C names a passenger; D describes the speaker setting work aside, which is a response to the call rather than evidence of its manner.' },

{ ..._CET, id:'RW-CET-06', diff:2,
  stim:{ kind:'text', t:'Materials scientists have long known that certain alloys "remember" a shape: deformed while cool, they snap back to their original form when heated. A team investigating why these alloys eventually stop working proposed that failure is not caused by the accumulated strain of repeated cycling itself, but by tiny amounts of oxygen that migrate into the crystal structure during the heated phase of each cycle.' },
  q:'Which finding, if true, would most directly support the team\'s proposal?',
  ch:[
    'Samples cycled the same number of times survive far longer when cycling is done in an oxygen-free chamber.',
    'Samples cycled more times fail sooner than samples cycled fewer times.',
    'The alloys return to their original shape more slowly as they age.',
    'Oxygen is present in the atmosphere at a roughly constant concentration.'],
  ans:0,
  expl:'The proposal blames oxygen rather than cycling, so the decisive test holds cycling constant and removes the oxygen. <b>A</b> does that and finds the failure largely goes away. B is consistent with the strain explanation the team is arguing against, and C describes the symptom rather than its cause.' },

{ ..._CET, id:'RW-CET-07', diff:3,
  stim:{ kind:'text', t:'A recurring finding in studies of expertise is that experts often perform worse than novices on tasks that violate the regularities of their field — a chess master, shown pieces scattered at random rather than in a plausible game position, recalls them no better than a beginner. One interpretation is that expertise consists largely of stored patterns, which are useless when the input does not match any of them. A competing interpretation holds that experts perceive the same raw information as novices but allocate attention differently, and simply misallocate it when the usual structure is absent.' },
  q:'Which finding, if true, would most directly support the second interpretation over the first?',
  ch:[
    'Chess masters recall plausible board positions far better than novices do.',
    'Chess masters recall scattered positions at novice levels even when given unlimited viewing time.',
    'When told in advance that a board is randomly arranged, chess masters recall it better than novices do.',
    'Novices improve on plausible positions after several months of study.'],
  ans:2,
  expl:'If the deficit were missing patterns, a warning could not help — there is still no pattern to retrieve. If it is misallocated attention, telling experts to expect randomness lets them deploy attention differently, and their advantage should reappear. <b>C</b> is that result. B is equally compatible with both accounts, and A is the baseline finding both are trying to explain.' },

{ ..._CET, id:'RW-CET-08', diff:2,
  stim:{ kind:'text', t:'Urban planners studying why some pedestrian streets thrive while others stay empty have suggested that the decisive factor is not the number of people passing through but the number with a reason to stop — errands, benches, food, shade. On this view, a street can carry heavy foot traffic and still feel dead.' },
  q:'Which finding, if true, would most directly support the planners\' suggestion?',
  ch:[
    'Pedestrian streets built in the last decade attract more visitors than older ones.',
    'Two streets with nearly identical pedestrian counts differ sharply in liveliness, and the livelier one has far more seating and small shops.',
    'Streets with heavy foot traffic tend to have higher retail rents.',
    'Most pedestrians on commercial streets report walking to a specific destination.'],
  ans:1,
  expl:'The suggestion is that <i>reasons to stop</i>, not raw traffic, produce liveliness. <b>B</b> holds traffic constant and varies the stopping opportunities, which isolates exactly the claimed factor. C connects traffic to rent rather than to liveliness, and D describes pedestrians\' intentions without linking them to how a street feels.' },

{ ..._CET, id:'RW-CET-09', diff:2,
  stim:{ kind:'text', t:'Conservationists reintroducing a butterfly to former habitat found that releases repeatedly failed even where the caterpillar\'s host plant was abundant. A researcher proposed that the missing requirement was a specific ant: the caterpillars secrete a sugary fluid that attracts ants, which in turn drive off parasitic wasps, and the ant species had disappeared from the restored sites.' },
  q:'Which finding, if true, would most directly support the researcher\'s proposal?',
  ch:[
    'The host plant grows more densely at restored sites than at sites where the butterfly persists.',
    'Caterpillars at sites where the ant was reestablished suffered markedly lower rates of wasp parasitism and survived to adulthood far more often.',
    'The ant species is widespread across the region as a whole.',
    'Adult butterflies at restored sites lived about as long as those at successful sites.'],
  ans:1,
  expl:'The proposal specifies a chain — ants present, wasps repelled, caterpillars survive — so the strongest support restores the ant and observes both later links. <b>B</b> does exactly that. A actually deepens the puzzle rather than explaining it, and D concerns adults, while the mechanism operates on caterpillars.' },

/* ── Command of Evidence: Quantitative ────────────────────────────────── */
{ ..._CEQ, id:'RW-CEQ-01', diff:2,

    note:'Each figure is the mean of four trials of 200 seeds.' },
  q:'A researcher is preparing a seed bank and notes that freezing is far more expensive than refrigeration. She argues that the added expense is justified for some species but not others. Which choice most effectively uses data from the table to support her argument?',
  ch:[
    'Milkweed germination rose from 43% at 4 °C to 81% at −18 °C, while blazing star was essentially unchanged, at 55% and 54%.',
    'Wild rye had the highest germination rate at −18 °C, at 88%.',
    'All four seed types germinated at rates above 40% under both storage conditions.',

  expl:'Her argument needs a contrast: freezing worth paying for in one case, not in another. Only <b>A</b> supplies both sides — a 38-point gain for milkweed against a 1-point difference for blazing star. B and D each report a single species, and C describes what the species have in common, which is the opposite of the contrast she needs.' },

{ ..._CEQ, id:'RW-CEQ-02', diff:2,
  stim:{ kind:'chart',
    cap:'Mean number of pollinator visits per hour, by plot type',
    ylab:'Visits per hour',
    cats:['Lawn','Mixed','Native','Meadow'],
    series:[{ name:'Visits per hour', values:[3, 11, 24, 29] }],
    note:'Observations were made over 40 hours at each of 12 sites.' },

{ ..._INF, id:'RW-INF-01', diff:2,
  stim:{ kind:'text', t:'The desert pupfish tolerates water temperatures and salinities that kill nearly every other freshwater fish, and biologists once treated this as evidence that the species is unusually hardy. But pupfish removed from those extreme springs and kept in mild water grow faster and reproduce more, and in shared tanks they are quickly displaced by ordinary minnows. This suggests that the pupfish\'s presence in extreme springs reflects not a preference for such conditions but rather ______' },

{ ..._INF, id:'RW-INF-02', diff:2,

{ ..._INF, id:'RW-INF-04', diff:3,

/* ---- 22-rw-conventions.js ---- */
/* ═══ Reading and Writing › Standard English Conventions ════════════════════
   Boundaries · Form, Structure, and Sense

   Both skills use the same stem, and the blank always sits inside the
   passage — the test never asks "which sentence is correct?"
   ══════════════════════════════════════════════════════════════════════════ */

const _SEC = { sec:'rw', dom:'Standard English Conventions',
  q:'Which choice completes the text so that it conforms to the conventions of Standard English?' };
const _BND = { ..._SEC, skill:'Boundaries' };
const _FSS = { ..._SEC, skill:'Form, Structure, and Sense' };

Q.push(

/* ── Boundaries ───────────────────────────────────────────────────────── */
{ ..._BND, id:'RW-BND-01', diff:2,
  stim:{ kind:'text', t:'The mathematician Emmy Noether lectured at the University of Göttingen for four years without pay or official ______ courses she taught were announced under a colleague\'s name.' },
  ch:['title. The','title, the','title the','title; and the'], ans:0,
  expl:'"The mathematician … lectured" and "The courses … were announced" are both complete sentences, and nothing joins them. Only a period (or a semicolon, which is not offered) will do. <b>A</b>. "title, the" is a comma splice, "title the" runs the two together, and a semicolon is never used immediately before a coordinating conjunction like <i>and</i>.' },

{ ..._BND, id:'RW-BND-02', diff:2,
  stim:{ kind:'text', t:'Ada Lovelace\'s notes on the Analytical ______ published in 1843, contain what is often described as the first algorithm written for a machine.' },
  ch:['Engine which were','Engine, which were','Engine; which were','Engine: which were'], ans:1,
  expl:'"which were published in 1843" is a supplement — extra information the sentence does not need to identify the notes — and a supplement in the middle of a sentence takes a comma at <i>both</i> ends. The closing comma is already printed after "1843," so the opening one must be supplied. <b>B</b>. A semicolon or colon cannot introduce a <i>which</i> clause.' },

{ ..._BND, id:'RW-BND-03', diff:2,
  stim:{ kind:'text', t:'A tide pool holds organisms adapted to conditions that change completely twice a ______ anemones, chitons, sea stars, and barnacles that spend half their lives submerged and half exposed to air.' },
  ch:['day,','day;','day:','day'], ans:2,
  expl:'What follows the blank is a list that spells out the general statement before it. A colon is the mark that introduces an explanation or list after a complete sentence, and "A tide pool holds organisms adapted to conditions that change completely twice a day" is complete. <b>C</b>. A semicolon requires a second independent clause, and the list is not one.' },

{ ..._BND, id:'RW-BND-04', diff:3,
  stim:{ kind:'text', t:'The long-distance migration of the Arctic ______ the longest of any animal, covering roughly seventy thousand kilometers each year.' },
  ch:['tern is','tern, is','tern; is','tern: is'], ans:0,
  expl:'"The long-distance migration of the Arctic tern" is the subject and "is" is its verb, and nothing may separate a subject from its verb — not a comma, not a semicolon, not a colon. <b>A</b>. The long subject makes the comma feel natural, which is exactly the instinct this question tests.' },

{ ..._BND, id:'RW-BND-05', diff:2,
  stim:{ kind:'text', t:'Researchers expected the transplanted corals to bleach within a single warm ______ three years later, most of the colonies were still growing.' },
  ch:['season, however,','season. However,','season however,','season, however'], ans:1,
  expl:'<i>However</i> is a conjunctive adverb, not a conjunction — it cannot hold two independent clauses together. The clauses need a period or semicolon, with a comma after <i>however</i>. <b>B</b>. Choice A is the classic comma splice, made no better by the adverb sitting inside it.' },

{ ..._BND, id:'RW-BND-06', diff:2,
  stim:{ kind:'text', t:'The only ______ that can survive the desiccation of a dry season are the ones whose seeds germinate within hours of the first rain.' },
  ch:['species, in this genus,','species in this genus','species in this genus,','species, in this genus'], ans:1,
  expl:'"in this genus" is restrictive — it narrows <i>which</i> species the sentence is about, so it belongs to the subject and takes no commas at all. <b>B</b>. Setting it off with commas (A) would make it optional information and leave "The only species … are the ones" oddly unmoored; a single comma (C, D) splits the subject from its verb.' },

{ ..._BND, id:'RW-BND-07', diff:3,
  stim:{ kind:'text', t:'The excavation produced pottery from three widely separated ______ Corinth, in mainland Greece; Cyprus, in the eastern Mediterranean; and Cyrene, on the North African coast.' },
  ch:['sources','sources,','sources:','sources;'], ans:2,
  expl:'A complete sentence precedes the blank and a list follows it, so the mark is a colon. <b>C</b>. Notice the list itself uses semicolons because each item already contains a comma — that is why a comma after "sources" would leave the reader unable to see where one source ends and the next begins.' },

{ ..._BND, id:'RW-BND-08', diff:2,
  stim:{ kind:'text', t:'Because the seafloor sediment accumulates at a nearly constant ______ a core taken from it can be read almost like a calendar.' },
  ch:['rate','rate,','rate;','rate:'], ans:1,
  expl:'"Because the seafloor sediment accumulates at a nearly constant rate" is a dependent clause opening the sentence, and an introductory dependent clause is followed by a comma. <b>B</b>. A semicolon or colon would each require a complete sentence before it, and this clause cannot stand alone.' },

{ ..._BND, id:'RW-BND-09', diff:3,
  stim:{ kind:'text', t:'The conservator\'s report listed the damage she had found — flaking pigment along the upper edge, a tear repaired with animal glue, and varnish that had yellowed past ______ recommended treating the varnish first.' },
  ch:['transparency — and','transparency and','transparency, and','transparency; and'], ans:0,
  expl:'A dash opened the supplement, so a dash must close it; punctuation used in pairs has to match. <b>A</b>. Closing with a comma or semicolon leaves the sentence with one dash and no partner, and dropping the mark entirely (B) buries the end of the list.' },

{ ..._BND, id:'RW-BND-10', diff:2,
  stim:{ kind:'text', t:'Rosalind Franklin\'s X-ray diffraction images were made with exposures lasting up to a hundred ______ the resulting photographs showed the helical structure with a clarity no earlier image had achieved.' },
  ch:['hours,','hours, and','hours and','hours'], ans:1,
  expl:'Two independent clauses joined by a coordinating conjunction take a comma before the conjunction. <b>B</b>. Choice A is a comma splice, choice C omits the comma that a joined pair of full clauses requires, and choice D fuses them outright.' },

{ ..._BND, id:'RW-BND-11', diff:2,
  stim:{ kind:'text', t:'Wangari Maathai founded the Green Belt Movement in ______ organization that has since supported the planting of tens of millions of trees across Kenya.' },
  ch:['1977 an','1977, an','1977; an','1977. An'], ans:1,
  expl:'"an organization that has since supported…" renames the Green Belt Movement — an appositive at the end of a sentence, set off with a single comma. <b>B</b>. A semicolon or period would demand a complete sentence after it, and the phrase has no verb of its own.' },

{ ..._BND, id:'RW-BND-12', diff:3,
  stim:{ kind:'text', t:'The team assumed the anomaly was an artifact of the ______ after recalibrating twice and finding it unchanged, they began to treat it as a real signal.' },
  ch:['instrument;','instrument,','instrument','instrument:'], ans:0,
  expl:'Both halves are complete sentences, and no conjunction joins them, so the mark must be a semicolon (or a period). <b>A</b>. The intervening phrase "after recalibrating twice and finding it unchanged" makes the second clause look subordinate, but its core — "they began to treat it as a real signal" — stands on its own.' },

/* ── Form, Structure, and Sense ───────────────────────────────────────── */
{ ..._FSS, id:'RW-FSS-01', diff:2,
  stim:{ kind:'text', t:'The collection of letters, notebooks, and field sketches donated to the museum last spring ______ still being catalogued.' },
  ch:['are','were','is','have been'], ans:2,
  expl:'The subject is "The collection," which is singular; "of letters, notebooks, and field sketches" is a prepositional phrase and can never supply the subject. Singular subject, singular verb: <b>is</b>. The plural nouns sitting right next to the blank are the whole trap.' },

{ ..._FSS, id:'RW-FSS-02', diff:2,
  stim:{ kind:'text', t:'Among the objects recovered from the shipwreck ______ a set of bronze weights, each stamped with the mark of a different port.' },
  ch:['was','were','are','have been'], ans:0,
  expl:'The sentence is inverted — the subject follows the verb. Strip the opening phrase and it reads "A set of bronze weights was recovered," so the subject is "a set," singular. <b>was</b>. "Objects" is inside a prepositional phrase and cannot control the verb.' },

{ ..._FSS, id:'RW-FSS-03', diff:2,
  stim:{ kind:'text', t:'Neither the director nor the lead engineers ______ willing to sign off on the launch date.' },
  ch:['was','is','were','has been'], ans:2,
  expl:'With <i>neither … nor</i>, the verb agrees with whichever subject is closer to it. "Engineers" is plural and sits next to the blank, so the verb is <b>were</b>. Had the two been reversed — "Neither the engineers nor the director" — the answer would be singular.' },

{ ..._FSS, id:'RW-FSS-04', diff:3,
  stim:{ kind:'text', t:'By the time the survey team reached the upper valley in 1911, local farmers ______ the terraces for generations.' },
  ch:['have farmed','farmed','had been farming','are farming'], ans:2,
  expl:'Two past events are in play, and one runs up to the other: the farming was already long under way when the team arrived. That calls for the past perfect. <b>had been farming</b>. The present perfect "have farmed" would tie the action to now, and the simple past would lose the ordering the sentence is built on.' },

{ ..._FSS, id:'RW-FSS-05', diff:2,
  stim:{ kind:'text', t:'The archive holds more than four thousand photographs, and each of ______ been digitized at high resolution.' },
  ch:['them have','them has','which have','these had'], ans:1,
  expl:'The subject is "each," which is singular no matter what follows it, so the verb is <b>has</b>. Choice C would leave the clause without a subject of its own after "and," and choice D shifts tense for no reason.' },

{ ..._FSS, id:'RW-FSS-06', diff:2,
  stim:{ kind:'text', t:'The cactus wren builds several nests each season but roosts in only one of ______ using the others as decoys.' },
  ch:['them,','it,','they,','its,'], ans:0,
  expl:'The pronoun stands for "several nests," which is plural, and it is the object of the preposition "of," so it takes the object form: <b>them</b>. Choice B is singular, C is the subject form, and D is a possessive with nothing to possess.' },

{ ..._FSS, id:'RW-FSS-07', diff:3,
  stim:{ kind:'text', t:'Trained as a physicist and largely self-taught in biology, ______' },
  ch:[
    'the double helix was proposed after Francis Crick studied diffraction images.',
    'Francis Crick brought an unusual background to the problem of DNA structure.',
    'it was Francis Crick\'s background that proved unusual for the problem of DNA structure.',
    'the problem of DNA structure was approached by Francis Crick from an unusual background.'],
  ans:1,
  expl:'An opening modifier attaches to whatever noun comes next, so the thing "trained as a physicist" must be the person, not a helix, a background, or a problem. Only <b>B</b> puts Francis Crick in that slot. This is why C is wrong despite naming him — the subject there is "it," and the noun following the modifier is still not a person.' },

{ ..._FSS, id:'RW-FSS-08', diff:2,

  ch:['In fact,','Similarly,','For example,','Consequently,'], ans:0,
  expl:'The last sentence overturns the explanation just given — limbs for shallow water, not for land. <b>In fact</b> introduces exactly that kind of correction. <i>Similarly</i> and <i>for example</i> would both signal agreement with the previous sentence, and <i>consequently</i> would make the correction a result of the very claim it contradicts.' },

{ ..._TRN, id:'RW-TRN-02', diff:2,

{ ..._TRN, id:'RW-TRN-03', diff:1,

{ ..._TRN, id:'RW-TRN-04', diff:3,

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
